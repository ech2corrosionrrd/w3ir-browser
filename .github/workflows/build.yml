name: Build
# Збірка інсталятора й портативної версії на сервері GitHub (прозоро й відтворювано з вихідного коду). Це не випуск: файли лише
# зберігаються як артефакт. Випуск (підпис оновлення ключем власника й публікація) виконує `npm run release:ci` на комп'ютері власника,
# бо приватний ключ підпису оновлень не лежить на сервері. Підпис коду видавця (Authenticode) вмикається, лише якщо задано секрети WIN_CSC_LINK і WIN_CSC_KEY_PASSWORD; без них збірка лишається непідписаною.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Завантажити Electron (скрипти встановлення вимкнено вище)
        run: node node_modules/electron/install.js
      - run: npm run lint
      - name: Підготувати підпис коду (Authenticode)
        id: sign
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "::add-mask::$WIN_CSC_KEY_PASSWORD"
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Секретів підпису немає: збірка буде непідписаною."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      # electron-builder підписує інсталятор і портативну версію, а latest.yml рахує вже від підписаних файлів.
      - run: npm run dist
      - name: Перевірити підпис Authenticode
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist/*.exe | ForEach-Object { Get-AuthenticodeSignature $_.FullName } | Where-Object { $_.Status -ne 'Valid' }
          if ($bad) { $bad | Format-List Path, Status, StatusMessage; throw 'Підпис Authenticode недійсний.' }
      - name: Контрольні суми
        shell: bash
        # манифест оновлення: latest.yml для стабільних версій, beta.yml для пре-релізів (v*-beta.*)
        run: cd dist && sha256sum *.exe $(ls latest.yml beta.yml 2>/dev/null) | tee SHA256SUMS.txt
      - name: Підтвердження походження збірок (Build Provenance Attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.exe
            dist/latest.yml
            dist/beta.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/beta.yml
            dist/SHA256SUMS.txt

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Завантажити Electron (скрипти встановлення вимкнено вище)
        run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run test:unit
      - name: Збірка пакунків Linux (AppImage, deb)
        run: npx electron-builder --linux
      - name: Контрольні суми
        run: cd dist && sha256sum *.AppImage *.deb | tee SHA256SUMS-linux.txt
      - name: Підтвердження походження збірок (Build Provenance Attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-linux
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux.txt

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Завантажити Electron (скрипти встановлення вимкнено вище)
        run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run test:unit
      - name: Збірка пакунків macOS (dmg, zip)
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Контрольні суми
        run: cd dist && shasum -a 256 *.dmg *.zip | tee SHA256SUMS-mac.txt
      - name: Підтвердження походження збірок (Build Provenance Attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-macos
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-mac.txt
