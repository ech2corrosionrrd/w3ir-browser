name: Build
# Збірка інсталятора й портативної версії на сервері GitHub (прозоро й відтворювано з вихідного коду). Це не випуск: файли лише
# зберігаються як артефакт. Випуск (підпис оновлення ключем власника й публікація) виконує `npm run release:ci` на комп'ютері власника,
# бо приватний ключ підпису оновлень не лежить на сервері. Підпис коду видавця (SignPath Foundation) підключається після схвалення заявки.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Завантажити Electron (скрипти встановлення вимкнено вище)
        run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run dist
      - name: Контрольні суми
        shell: bash
        run: cd dist && sha256sum *.exe latest.yml | tee SHA256SUMS.txt
      - name: Підтвердження походження збірок (Build Provenance Attestation)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/latest.yml
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Завантажити Electron (скрипти встановлення вимкнено вище)
        run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run test:unit
      - name: Збірка пакунків Linux (AppImage, deb)
        run: npx electron-builder --linux
      - name: Контрольні суми
        run: cd dist && sha256sum *.AppImage *.deb | tee SHA256SUMS-linux.txt
      - name: Підтвердження походження збірок (Build Provenance Attestation)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux.txt

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Завантажити Electron (скрипти встановлення вимкнено вище)
        run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run test:unit
      - name: Збірка пакунків macOS (dmg, zip)
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Контрольні суми
        run: cd dist && shasum -a 256 *.dmg *.zip | tee SHA256SUMS-mac.txt
      - name: Підтвердження походження збірок (Build Provenance Attestation)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-mac.txt
