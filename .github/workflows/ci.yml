name: CI
# Перед комітом CI виконується локально: npm run ci (build/ci-local.js). На GitHub автоматично (push у main і pull_request) йдуть лише
# швидкі дешеві перевірки на Linux: check + unit-cross. Повний e2e (windows) і macOS — вручну (workflow_dispatch): хвилини Actions обмежені.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:unit
      - run: npm audit --omit=dev
      - name: Секрети не повинні потрапляти в репозиторій
        shell: bash
        run: |
          if git ls-files | grep -iE '\.(pem|key|pfx|p12)$|^build/keys/|vault\.(bin|pepper)$'; then echo "Знайдено файли з секретами"; exit 1; fi
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_' -- . ':!.github' ':!build/ci-local.js'; then echo "Знайдено секрет"; exit 1; fi
  # Повний автотест у справжньому вікні Electron (обов'язковий: на runner'і GitHub кілька запусків поспіль зелені).
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Завантажити Electron (скрипти встановлення вимкнено вище)
        run: node node_modules/electron/install.js
      - run: npm test
  # Швидкі unit-тести без Electron на Linux і macOS: перевіряють, що чиста логіка не прив'язана до Windows.
  unit-cross:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","macos-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
