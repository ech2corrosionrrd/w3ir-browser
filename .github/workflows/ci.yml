name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm audit --omit=dev
      - name: Секрети не повинні потрапляти в репозиторій
        shell: bash
        run: |
          if git ls-files | grep -iE '\.(pem|key|pfx|p12)$|^build/keys/|vault\.(bin|pepper)$'; then echo "Знайдено файли з секретами"; exit 1; fi
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_' -- . ':!.github'; then echo "Знайдено секрет"; exit 1; fi
  # Повний автотест у справжньому вікні Electron (обов'язковий: на runner'і GitHub кілька запусків поспіль зелені).
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Завантажити Electron (скрипти встановлення вимкнено вище)
        run: node node_modules/electron/install.js
      - run: npm test
